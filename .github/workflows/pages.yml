name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/sdk/**"
      - "contracts/midnight/deployments/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static export
        run: pnpm --filter @plutusshield/web build
        env:
          # e.g. "/PlutusShield" for https://kshot3000.github.io/PlutusShield/
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Preview Blockfrost project id (repo secret) so live /pool can read chain + submit LP txs
          NEXT_PUBLIC_BLOCKFROST_PREVIEW_ID: ${{ secrets.BLOCKFROST_PREVIEW_ID }}
          # Midnight Preprod Blockfrost project id (repo secret). The Midnight-hosted Preprod
          # indexer was retired 2026-10-09; Blockfrost serves it (CORS open). The NEXT_PUBLIC_
          # copy lets the live Midnight panels stream in the browser; the plain one lets
          # scripts/snapshot-midnight.mjs refresh the offline snapshot at build time.
          NEXT_PUBLIC_BLOCKFROST_MIDNIGHT_PREPROD_ID: ${{ secrets.BLOCKFROST_MIDNIGHT_PREPROD_ID }}
          BLOCKFROST_MIDNIGHT_PREPROD_ID: ${{ secrets.BLOCKFROST_MIDNIGHT_PREPROD_ID }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
